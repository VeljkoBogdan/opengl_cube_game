name: CMake build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Show build output (debug aid, remove later)
        shell: bash
        run: find build -maxdepth 2 -type f \( -name "*.exe" -o -perm -u+x \) -not -path "*/CMakeFiles/*" -not -path "*/_deps/*"

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: game-windows
          path: build/Release/*.exe
          if-no-files-found: error

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          exe=$(find build -maxdepth 1 -type f -perm -u+x ! -name "*.so*" | head -n1)
          echo "Packaging $exe"
          tar -czf game-linux.tar.gz -C "$(dirname "$exe")" "$(basename "$exe")"

      - name: Upload (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: game-linux
          path: game-linux.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -R artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true